[package]
name = "lfit_rs"
version = "0.1.0"
edition = "2024"


[lib]
name = "lfit_rs"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
numpy = "0.28.0"
rayon = "1.11.0"
roche-rs = "0.5.4"

[dependencies.pyo3]
version = "0.28.2"
# "abi3-py38" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.8
features = ["abi3-py38"]
