[package]
name = "lfit_rs"
version = "0.3.0"
edition = "2024"
description = "Rust translation of the LFIT library for fitting light curves of eclipsing cataclysmic variables."
readme = "README.md"
license = "MIT"

[lib]
name = "lfit_rs"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
numpy = "0.29.0"
rayon = "1.11.0"
roche-rs = ">=0.5.6, <0.6"

[dependencies.pyo3]
version = ">=0.29.2"
# "abi3-py38" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.8
features = [
    "abi3-py38",
    "experimental-inspect",
]